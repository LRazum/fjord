<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0f14">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fjord">
  <meta name="description" content="Norwegian 4×4 treadmill intervals guided by live heart rate.">
  <title>Fjord</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="app">
    <section id="screen-home" class="screen" hidden></section>
    <section id="screen-ready" class="screen screen-ready" hidden></section>
    <section id="screen-workout" class="screen screen-workout" hidden></section>
    <section id="screen-summary" class="screen" hidden></section>
    <section id="screen-history" class="screen" hidden></section>
    <section id="screen-detail" class="screen" hidden></section>
    <section id="screen-progress" class="screen" hidden></section>
    <section id="screen-settings" class="screen" hidden></section>
    <section id="screen-onboarding" class="screen" hidden></section>
  </div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript>Fjord needs JavaScript.</noscript>
</body>
</html>
